name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For an early idea you would like to talk through first, start a thread in
        [Ideas](https://github.com/orcher-io/quickstart/discussions/categories/ideas).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python SDK
        - TypeScript SDK
        - Rust SDK
        - sdk-core
        - protos
        - Engine
        - Quickstart
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what makes it hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. A short code sketch of the API you have in mind helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
